<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M's Manga - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-center" style="background: var(--primary-gradient);">
    <div class="auth-container">
        <div class="auth-logo">
            <h1>M's Manga</h1>
            <p>Your one stop local shop for manga!</p>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')">Login</div>
            <div class="auth-tab" onclick="switchTab('register')">Register</div>
        </div>

        <div id="successMessage" class="alert alert-success"></div>

        <!-- Login Form -->
        <div id="loginForm" class="auth-form active">
            <h2 class="text-center">Welcome Back!</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
                    <div class="form-error" id="loginEmailError"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                    <div class="form-error" id="loginPasswordError"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
            </form>
            <p class="auth-info">Default account: admin@bookstore.com / admin123</p>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="auth-form">
            <h2 class="text-center">Create Account</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="registerName">Full Name</label>
                    <input type="text" id="registerName" class="form-control" placeholder="Enter your full name" required>
                    <div class="form-error" id="registerNameError"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email" required>
                    <div class="form-error" id="registerEmailError"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" class="form-control" placeholder="Create a password" required>
                    <p class="form-help">Minimum 6 characters</p>
                    <div class="form-error" id="registerPasswordError"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="registerConfirmPassword">Confirm Password</label>
                    <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Confirm your password" required>
                    <div class="form-error" id="registerConfirmPasswordError"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
            </form>
        </div>

        <div class="guest-section">
            <div class="auth-divider">
                <span>or</span>
            </div>
            
            <button class="btn btn-gray btn-block" onclick="continueAsGuest()">Continue as Guest</button>
            <p class="auth-info">Browse books without an account</p>
        </div>
    </div>

    <script>
        // Initialize users from localStorage or create default admin
        if (!localStorage.getItem('users')) {
            const defaultUsers = [
                {
                    name: 'Admin User',
                    email: 'admin@bookstore.com',
                    password: 'admin123',
                    createdAt: new Date().toISOString()
                }
            ];
            localStorage.setItem('users', JSON.stringify(defaultUsers));
        }

        // Check if user is already logged in
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser && currentUser.isLoggedIn) {
            window.location.href = 'index.html';
        }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            const successMessage = document.getElementById('successMessage');
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            
            successMessage.style.display = 'none';
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            
            clearErrors();
        }

        function clearErrors() {
            const errors = document.querySelectorAll('.form-error');
            errors.forEach(error => {
                error.style.display = 'none';
                error.textContent = '';
            });
        }

        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function handleRegister(event) {
            event.preventDefault();
            clearErrors();
            
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim().toLowerCase();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            
            let isValid = true;
            
            if (name.length < 2) {
                showError('registerNameError', 'Name must be at least 2 characters');
                isValid = false;
            }
            
            if (!isValidEmail(email)) {
                showError('registerEmailError', 'Please enter a valid email address');
                isValid = false;
            }
            
            const users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.some(user => user.email === email)) {
                showError('registerEmailError', 'This email is already registered');
                isValid = false;
            }
            
            if (password.length < 6) {
                showError('registerPasswordError', 'Password must be at least 6 characters');
                isValid = false;
            }
            
            if (password !== confirmPassword) {
                showError('registerConfirmPasswordError', 'Passwords do not match');
                isValid = false;
            }
            
            if (isValid) {
                const newUser = {
                    name: name,
                    email: email,
                    password: password,
                    createdAt: new Date().toISOString()
                };
                
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                
                const successMessage = document.getElementById('successMessage');
                successMessage.textContent = '✅ Account created successfully! You can now login.';
                successMessage.style.display = 'block';
                
                document.getElementById('registerName').value = '';
                document.getElementById('registerEmail').value = '';
                document.getElementById('registerPassword').value = '';
                document.getElementById('registerConfirmPassword').value = '';
                
                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('loginEmail').value = email;
                }, 2000);
            }
            
            return false;
        }

        function handleLogin(event) {
            event.preventDefault();
            clearErrors();
            
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            
            let isValid = true;
            
            if (!email) {
                showError('loginEmailError', 'Please enter your email address');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('loginEmailError', 'Please enter a valid email address');
                isValid = false;
            }
            
            if (!password) {
                showError('loginPasswordError', 'Please enter your password');
                isValid = false;
            }
            
            if (isValid) {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify({
                        name: user.name,
                        email: user.email,
                        isLoggedIn: true,
                        loginTime: new Date().toISOString()
                    }));
                    
                    window.location.href = 'index.html';
                } else {
                    showError('loginPasswordError', 'Invalid email or password. Please try again.');
                }
            }
            
            return false;
        }

        function continueAsGuest() {
            localStorage.setItem('currentUser', JSON.stringify({
                name: 'Guest User',
                email: '',
                isLoggedIn: false,
                loginTime: new Date().toISOString()
            }));
            
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
