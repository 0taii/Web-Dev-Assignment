<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M's Manga - Payment Successful</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-center" style="background: var(--primary-gradient);">
    <div class="success-container">
        <div class="success-icon"></div>
        
        <h1>Payment Successful!</h1>
        
        <p class="success-message">
            Thank you for your purchase! Your transaction has been processed successfully.
        </p>
        
        <div class="card-display">
            <div class="card-number-display" id="maskedCardNumber">**** **** **** 1234</div>
        </div>

        <div class="transaction-details">
            <div class="transaction-row">
                <span class="transaction-label">Transaction ID</span>
                <span class="transaction-value" id="transactionId">TXN123456789</span>
            </div>
            <div class="transaction-row">
                <span class="transaction-label">Date</span>
                <span class="transaction-value" id="transactionDate">2024-01-15</span>
            </div>
            <div class="transaction-row">
                <span class="transaction-label">Status</span>
                <span class="transaction-value text-success">Completed</span>
            </div>
        </div>
        
        <a href="index.html" class="btn btn-success btn-lg mt-3">Continue Shopping</a>
    </div>

    <script>
        // Get the last 4 digits from localStorage
        const lastFourDigits = localStorage.getItem('lastFourDigits') || '1234';
        
        // Display masked card number
        document.getElementById('maskedCardNumber').textContent = '**** **** **** ' + lastFourDigits;
        
        // Generate random transaction ID
        const transactionId = 'TXN' + Math.random().toString(36).substr(2, 9).toUpperCase();
        document.getElementById('transactionId').textContent = transactionId;
        
        // Display current date
        const today = new Date();
        const formattedDate = today.toISOString().split('T')[0];
        document.getElementById('transactionDate').textContent = formattedDate;
        
        // Clear localStorage
        localStorage.removeItem('lastFourDigits');
    </script>
</body>
</html>
